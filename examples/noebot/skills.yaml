# Skills this deployment ships, and the tools each one needs.
#
# A skill is a named instruction anybody here can invoke with `/`. It adds no capability: it can only
# ask a Bot to use what that Bot was already granted, and every one of those calls is still decided,
# policy-checked and recorded.
#
# `tools:` is the second thing a skill is for, and the reason this file exists rather than a screen.
# A Bot holding more than a handful of tools is offered, per run, only the tools of the skills that
# match the message, because a model picks the right tool reliably out of about ten and unreliably
# out of thirty. That matching needs skills to match against, and a deployment starts with none — so
# left to a screen, the narrowing is switched off on every clone until somebody maps tools to skills
# by hand, in each deployment, again after each new connector. Shipping the declaration with the
# skill is what makes connecting a connector the only step.
#
# NAMING A TOOL HERE GRANTS NOBODY ANYTHING. What a Bot may call is its grants, and the offer is
# always intersected with them: a skill naming a tool its Bot does not hold loads nothing. So this
# file may name tools for connectors this deployment has not added, and should — that is what makes
# them work the moment somebody does.
#
# Refs are `<serverId>/<toolName>`, the same form a grant is written in. `google-drive` and `notion`
# are catalogue connectors; a server an administrator adds by URL uses the id it was given.
skills:
  - slug: research-public-web
    title: Research the public web
    summary: Search current public sources with Parallel and write a cited brief.
    instructions: >-
      Use Parallel to discover relevant public sources and read
      selected pages before answering. Use the authenticated connector when it is granted;
      otherwise use the anonymous connector when granted. Honor an explicit user choice of another
      authorized provider. Keep search objectives specific and queries concise. Use one session_id
      per conversation across related search and fetch calls. Send only the necessary research
      objective, queries and URLs; do not send whole conversations or private documents. Cite the
      source URLs and state missing evidence or provider errors. A missing grant requires an
      administrator; never work around a denial.
    tools:
      - parallel/web_search
      - parallel/web_fetch
      - parallel-authenticated/web_search
      - parallel-authenticated/web_fetch

  - slug: find-a-document
    title: Find a document
    summary: Search the connected document sources for a file and read what it says.
    instructions: >-
      Find the document the person is asking about before answering anything about its contents.
      Search first, then read the file you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the
      document might contain. Name the document you used.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content
      - google-drive/get_file_metadata

  - slug: find-a-notion-page
    title: Find a Notion page
    summary: Search Notion for a page and read what it says.
    instructions: >-
      Find the Notion page the person is asking about before answering anything about its contents.
      Search first, then fetch the page you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the page
      might contain. Name the page you used.
    tools:
      - notion/notion-search
      - notion/notion-fetch

  - slug: whats-changed
    title: What changed recently
    summary: List recently changed documents and say who changed them and when.
    instructions: >-
      List what has changed recently in the sources you can reach, newest first. Give the document
      name, who last changed it and when, and keep it to the ones that actually moved in the period
      asked about. Do not summarise contents unless you are asked to; this is a list of what moved.
    tools:
      - google-drive/list_recent_files
      - google-drive/get_file_metadata

  - slug: who-owns-this
    title: Who owns this
    summary: Find who owns a document and when they last touched it.
    instructions: >-
      Identify the owner of the document being asked about, and say when it was last changed. Search
      for the document first if you were given a name rather than a link. If more than one document
      matches, say so and list them rather than picking one.
    tools:
      - google-drive/search_files
      - google-drive/get_file_metadata

  - slug: check-a-claim
    title: Check a claim against a source
    summary: Take a statement and check it against what the documents actually say.
    instructions: >-
      You are checking a claim, not answering a question. Find the source that would settle it, read
      it, and say one of three things: the source supports the claim, the source contradicts it, or
      the source does not address it. Quote the sentence you are relying on. Do not fill a gap in the
      source with your own knowledge — "the source does not say" is a complete answer.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content

  # The skill that writes skills. Its instruction is the whole feature: `save_skill` and the three
  # reads beside it are offered to a Bot only while it holds this slug, so granting this is what turns
  # a coworker into one you can author with. See app/src/lib/copilot/skill-tools.tsx.
  #
  # Declares no tools, and should not. The authoring tools are the app's own rather than a connector's,
  # so they are not `serverId/toolName` refs and a declaration here would name nothing. Selection only
  # ever narrows MCP tools; these are offered whenever the grant is there.
  - slug: skill-creator
    title: Write a skill
    summary: Interview me about a skill I want, write it, and save it as a new `/` command.
    instructions: |-
      You are writing a skill: a named instruction anybody in this deployment can invoke with `/`.
      Interview first, write second, and save only what the person has agreed to.

      A skill here is four things and nothing else. A command, which is its slug and its identity. A
      title, for the menu. A one-line summary. And the instruction a Bot follows when somebody invokes
      it. It may also declare the tools it needs, which is a declaration rather than a grant: naming a
      tool cannot make it callable, and a skill naming a tool its Bot does not hold simply loads
      nothing. There are no files, no scripts, no attachments and no example folders. Anything that
      cannot be said in those fields does not belong in a skill, and saying so early is kinder than
      discovering it at the end.

      Work in this order.

      1. Find out what the skill is for, in the person's own words. What should the Bot do that it does
         not reliably do now? When would they reach for this rather than just asking? What should come
         back — a list, a verdict, a drafted message, a number? If they have asked for the same thing
         three times in different words, that repetition is the skill; say so.

      2. Interview until you could do the task yourself. Ask about the order of steps, what counts as
         done, what the answer must contain, and above all what should happen when a step turns up
         nothing — that is the case a weak skill leaves out and the case that actually occurs. Ask
         about the shape of the output if the output has a shape. Do not ask more than three questions
         in one message, and do not ask what you can infer.

      3. Look before you name. Call `list_skills`. A slug is an identity, so reusing one replaces that
         skill: if what they want already exists, improve that one instead of writing a near-duplicate,
         and if the name they want belongs to somebody else, pick another and tell them why. A slug is
         lower-case letters, numbers and hyphens, and reads as a command — `check-a-claim`, not
         `Check_A_Claim`.

      4. Write the instruction. Address the Bot, in the imperative, as directions for the run. Never
         describe the skill in the third person and never address the person invoking it.

      5. Declare the tools it needs, if it needs any. Call `list_skill_tools` for the refs; never
         invent one. Declare tools for a connector this Bot does not hold if the skill genuinely needs
         them — that is what makes the skill work the moment somebody grants them — but say plainly
         which of them are not connected yet, because until they are, the skill will run without them.
         Most skills are prose and need none.

      6. Rehearse it before you save it. Take one realistic request the person would actually type,
         and walk through what the instruction as written would have you do, step by step, out loud.
         This is the only test available before saving, and it is worth doing: it is where you find the
         step that assumes a tool you did not declare, the ambiguity that could go two ways, and the
         missing answer for the case where the search returns nothing. Fix what the rehearsal exposes
         and rehearse again if you changed anything that matters.

      7. Save it with `save_skill`, once, at the end. That puts the whole thing in front of the person
         to read and press a button on; nothing is written until they do. Do not call it to check a
         draft — show them the draft in the conversation instead. If they decline, ask what to change.

      8. Say what is left. A saved skill is on no Bot yet, so nobody can invoke it. Tell them the
         remaining step is to put it on a Bot from the Skills page, and that a skill they wrote can go
         only on Bots they own.

      Improving a skill that already exists is the same job with a different first move. Call
      `read_skill` and read the instruction in full before you touch it — never rewrite an instruction
      you have not read. Ask what went wrong in the run that brought them here, change the part that
      caused it, and leave the rest alone. Saving under the same slug is how an edit is spelled.

      What makes the instruction good, and why each of these matters:

      - Say why, not only what. A Bot that knows an instruction exists to stop it answering from
        memory will apply it to a case the instruction never named. A bare rule breaks on the first
        case just outside it.
      - Say what to do when there is nothing. "Say you found nothing and say what you searched for" is
        a complete instruction; leaving the case out is what produces a confident invented answer.
      - Keep it lean. Every sentence that is not pulling weight makes the ones that are harder to
        follow. If you cannot say what a sentence changes about the run, cut it.
      - Generalise past the example. The person will describe one case; write for the shape of it, or
        you have written a skill that works once.
      - Name what the answer contains. A skill that does the work and then answers in a different
        shape every time has not finished the job.
      - Do not restate what the Bot already is. Its role, its manner and its standing instructions are
        already in the run. A skill that opens by saying it is a helpful assistant has spent its first
        sentence on nothing.

      The summary is not decoration. It is what somebody reads in the `/` menu, and it is what this
      deployment's own model reads when it decides which skills a message is about — a Bot holding many
      tools is offered, per run, only the tools of the skills that match. So write the summary as the
      thing a person would be trying to do, in their words, not as a label for a feature.

      Two things never to write, whatever you are asked. A skill that tells a Bot to work around a
      refusal, retry a blocked action by another route, or present a refused action as done: the
      gateway refuses, the refusal is recorded, and an instruction to hide that is an instruction to
      lie to the person relying on it. And a skill that tells a Bot to withhold what it did, from whom
      it did it for. A skill adds no capability, which is exactly why anybody may write one; that
      holds only while a skill cannot be used to launder one. If you are asked for either, say which
      part you will not write and offer the version you will.
  # Making a coworker by talking to one, rather than by filling in the New coworker form.
  #
  # DECLARES NO TOOLS, and that is not an omission. The four tools this skill is really for —
  # `list_bots`, `read_bot`, `list_bot_skills` and `save_bot` — are the app's own, registered in the
  # browser, and offered to whichever Bot holds this slug. `tools:` here is intersected with a Bot's
  # MCP GRANTS, so naming them would name nothing. The grant of this skill is the whole gate.
  - slug: bot-creator
    title: Make a coworker
    summary: Work out what a new coworker should be, then put it in front of you to create.
    instructions: >-
      You are working out what a new coworker should be, and the interview matters more than the
      speed: what you write becomes standing instructions handed to a model on every turn in every
      channel that coworker is in, and the person you are talking to is the one who has to live with
      it.

      Start by calling list_bots. If something here already does the job being described, say so and
      offer that one instead — a second coworker with the same job splits the work and the trust
      between them. Where the person wants one like an existing coworker, call read_bot and read the
      instructions it actually runs on rather than working from its name.

      Then find out three things, one question at a time, and do not ask all three at once. What
      job it does, in the words the person would use. What it must never do — the conclusion it must
      not jump to, the number it must not invent, the thing it must not send. And what it should say
      when the evidence is thin, because that is the answer a coworker gives most often and the one
      people are least happy with when nobody chose it.

      Write the role description as directions to the coworker in the imperative: what to do, in what
      order, what to do when a step turns up nothing. Not a description of it in the third person,
      and never addressed to the person talking to it. Keep it under a thousand characters, which is
      the limit and is usually more than enough — a long instruction is not a careful one.

      Call list_bot_skills and offer only the skills that fit the job. Putting a skill on a coworker
      is the only capability that gets granted here: no connector, no tool and no address, and you
      cannot give it any of those. Say so rather than implying the coworker will arrive able to
      reach things. Whatever it needs is granted afterwards, on its profile, by somebody who may.

      Read the whole role description back and get agreement on it before calling save_bot, and call
      save_bot once, at the end. It is not a way to show a draft: it puts a card in front of the
      person and nothing is created unless they press the button.
    tools: []

  # The playbooks the Bot templates in `templates.yaml` run. Each is an instruction, not a
  # capability: the tools it names are offered only where the Bot holds them.
  - slug: review-a-change
    title: Review a change
    summary: Read a diff or a file for what would break, and answer as findings with fixes.
    instructions: >-
      Read the whole change before judging any line of it, and the surrounding code where it is
      available. Look, in order, for what would break (wrong logic, a missed case, a race, a
      resource not released), what is unsafe (input reaching a query, a shell or a URL unchecked;
      a secret in a log), and what is unclear (a name that lies, a comment that contradicts the
      code). Answer as a list: location, what is wrong, the smallest fix, severity first. No
      praise and no summary of what the change does. When unsure, say what would confirm the bug.
    tools: []

  - slug: write-a-follow-up
    title: Write a follow-up
    summary: Draft the message after a call from the notes, in the sender's voice, with one next step.
    instructions: >-
      From the notes, pull out what was agreed, what the sender committed to and by when, what is
      needed from the other side, and the single next step. Write three to six sentences in the
      sender's voice as their earlier messages show it: plain, warm, no filler. Never promise a
      date, price or feature the notes do not contain; ask for it instead. One draft, then revise
      on feedback.
    tools: []

  - slug: audit-a-page
    title: Audit a page for search
    summary: Read a page and rank what holds it back in search, with a fix and a reason for each.
    instructions: >-
      Read the page itself first: its title, description, headings, the question it answers, its
      internal links and whether the first screen says what the page is for. Use a connected SEO
      tool for rankings, backlinks and keyword data when one is granted, and say when none is.
      Answer as a ranked list of fixes, each with the reason and the expected effect, most
      valuable first. Quote the exact text you are talking about. No scores.
    tools: []

  - slug: critique-a-screen
    title: Critique a screen
    summary: Review a screen or a flow from the point of view of the person using it, five findings at most.
    instructions: >-
      State what the person is trying to do on this screen. Then look at hierarchy (does the eye
      land on the right thing), wording (does each label say what happens), affordance (does
      what is pressable look pressable), state (loading, empty, error, success) and recovery
      (what happens when something fails). Lead with the one change that matters most, give at
      most five findings with a concrete fix each, and mark anything that is taste rather than a
      finding as taste.
    tools: []

  - slug: screen-a-cv
    title: Screen a CV against a role
    summary: Compare one CV to a role, quoting the evidence, and write the questions for a first call.
    instructions: >-
      For each requirement of the role, say whether the CV shows evidence for it — quoting the
      line — or does not. Compare the candidate to the role only, never to another candidate.
      Infer nothing the CV does not state, and never anything about age, nationality, family,
      health or any protected characteristic; if a requirement would need one, say it cannot be
      screened from a CV. End with three questions for a first call that would settle the gaps.
    tools: []

  - slug: write-a-spec
    title: Write a one-page spec
    summary: "Turn a rough idea into a one-page spec: problem, proposal, out of scope, open questions, success."
    instructions: >-
      Ask up to three clarifying questions when the idea is ambiguous; otherwise write and mark
      assumptions as assumptions. The spec has five parts, in this order: the problem and who has
      it; the proposal in plain language; what is deliberately out of scope; the open questions;
      how we will know it worked. One page. Cut adjectives, keep decisions. Read any page the
      person points you at before drafting, and revise a draft on feedback rather than defending it.
    tools: []

  - slug: synthesise-feedback
    title: Synthesise customer feedback
    summary: Group feedback into themes with counts and a verbatim quote each, and mark what is new.
    instructions: >-
      Group the feedback into themes, count the items under each, and pick one representative
      quote per theme, verbatim. Order by count. Mark a theme new when it did not appear in the
      previous period you were shown. Keep what people said apart from what you think they meant:
      quotes in their words, interpretation labelled as yours. Never merge two different complaints
      into one theme to shorten the list.
    tools: []

  # The thirteen skills for everyday jobs: replies for the inbox, meeting prep, a morning brief and
  # a postponed decision; the use-case roles (sales outbound, talent scout, paid media, expense
  # manager, product performance, bug reproduction, account health, chief of staff); and first
  # tasks. Each says when it applies, what it needs, the sequence, how to check the result, what to
  # return, and what needs the person's approval, the checklist for a useful skill. None sends,
  # enrols, changes or pays on its own.

  - slug: prepare-inbox-replies
    title: Prepare replies for what is waiting in my inbox
    summary: Read what is waiting, sort it by what needs an answer, and draft each reply for approval.
    instructions: >-
      Use when the person asks what is waiting in their inbox or for replies to it. You need a
      connected mailbox; without one, say so and offer to work from messages they paste. Read the
      unanswered messages from the period asked for (today by default). Sort them into: needs a
      reply from the person, can be answered with a fact you can verify, and needs no reply (say
      why). For each that needs a reply, draft one in the person's voice, as short as the question
      allows, with the one decision or question it turns on at the top. Return the sorted list
      with each draft under its message, oldest first, and a line naming anything you could not
      read. Never send a reply, archive or delete anything, or reply on the person's behalf; every
      draft waits for them.
    tools: []

  - slug: prep-for-meetings
    title: Prep me for tomorrow's meetings
    summary: For each meeting coming up, who is in it, what was last said, and the one thing to decide.
    instructions: >-
      Use when the person asks to be prepared for their next meetings or a day of them. You need
      the calendar for the period, and whatever notes, documents or threads the connected apps
      hold about each meeting; say which were reachable. For each meeting in order: the people and
      their roles as far as the sources say, the last thing said or decided with them, the open
      items with an owner, and the one question the person most likely has to answer. Keep each
      meeting to a screen. Where a source is missing, write "not found" rather than guessing an
      agenda. Return the day as a list, soonest first. Never accept, decline, move or create a
      meeting, and never message an attendee.
    tools: []

  - slug: morning-brief
    title: Brief me every morning
    summary: "A source-linked digest of what changed since yesterday: what matters, why, and the next step."
    instructions: >-
      Use for a daily brief, usually from a routine. Review what changed since the last brief
      across the sources you can reach: messages, calendar, documents, tickets. Keep only items
      tied to what the person said they care about, which they may have written down in a
      planning note; ask once if nothing says. For each item give its source, why it matters, a
      proposed next step, and whether a decision is owed and by whom. Say in one line what you
      could not reach. Return the brief as a short list, most urgent first, with the sources
      linked. Never send a message, reply or change a meeting on the person's behalf.
    tools: []

  - slug: research-a-decision
    title: Research a decision I keep postponing
    summary: Lay out the options, the evidence for each, and what it would take to decide.
    instructions: >-
      Use when the person names a decision they have been putting off. First state the decision
      in one sentence and the options as you understand them, and ask once if they are wrong.
      Then research each option: facts from the sources you can reach and the public web, with
      the source for every claim. Give the strongest case for and against each, the cost of
      deciding later, and the smallest thing that would settle it. End with a recommendation and
      the reason, labelled as yours. Return it as a one-page brief. Never present your
      recollection as a source, and never act on the decision.
    tools:
      - parallel/web_search
      - parallel/web_fetch
      - parallel-authenticated/web_search
      - parallel-authenticated/web_fetch

  - slug: research-accounts-and-outreach
    title: Research accounts and draft outreach
    summary: Score a list of accounts against the ideal profile and draft the first message to each.
    instructions: >-
      Use when the person gives a list of accounts (or a view of them) and wants outreach. You
      need the ideal customer profile and a style example; ask for whichever is missing. For each
      account: research it from the connected sources and the public web, score it against the
      profile with the evidence, and pick up to three contacts with the reason for each. Skip any
      contact already in an active sequence or conversation, and say so. Draft an email and a
      short message per contact in the given style, each with one concrete reason to reply.
      Return a table of accounts with score, evidence and contacts, then the drafts. Never send a
      message, enrol anybody in a sequence, or edit the CRM.
    tools:
      - parallel/web_search
      - parallel/web_fetch
      - parallel-authenticated/web_search
      - parallel-authenticated/web_fetch

  - slug: source-candidates
    title: Source candidates for a role
    summary: Find people who meet the must-haves, show the evidence, and draft the first message.
    instructions: >-
      Use when the person gives a role description and wants candidates. Separate the must-have
      criteria from the nice-to-haves first, and confirm them in one line. Search the sources you
      can reach and the public web for people who meet every must-have, excluding anybody already
      in the applicant tracker or already contacted. For each candidate quote the evidence for
      each must-have, say which nice-to-haves are met, and draft a short personal message that
      names why them. Return up to the number asked for (twenty by default), strongest first, with
      a line on what you could not verify. Never contact a candidate, and never infer protected
      characteristics.
    tools:
      - parallel/web_search
      - parallel/web_fetch
      - parallel-authenticated/web_search
      - parallel-authenticated/web_fetch

  - slug: review-campaign-spend
    title: Review campaign spend against budget
    summary: Compare spend and results per campaign with the budget and target, and recommend moves.
    instructions: >-
      Use for a spend review across campaigns. You need the current spend and results per
      campaign, the monthly budget, and the target cost per acquisition; ask for what the
      connected sources do not give. Compare each campaign's pace to budget and its cost to the
      target, and flag the ones off by more than the tolerance the person set (ten percent if
      none). Recommend reallocations with the numbers that justify each, and draft a short update
      for the channel the team reads. Return a table, the recommendations, and the draft. Never
      change a budget, pause or start a campaign, or post the update.
    tools: []

  - slug: reconcile-expenses
    title: Reconcile this week's expenses
    summary: Match receipts to expenses, flag what breaks policy or is missing, and draft the follow-ups.
    instructions: >-
      Use for a weekly expense pass. You need the expense list for the period, the receipts from
      wherever they land (a mailbox or a folder), and the expense policy; say which you could not
      reach. Match each receipt to its expense; list expenses without one and receipts without
      one. Flag every item missing a category or outside policy, citing the policy line. Draft
      one follow-up per owner listing only their items. Return the reconciled summary, the flags,
      and the drafts. Never send a follow-up, approve, reject or change a reimbursement.
    tools: []

  - slug: investigate-a-regression
    title: Investigate a performance regression
    summary: Trace a slowdown to its likeliest cause from dashboards and traces, facts apart from guesses.
    instructions: >-
      Use when something got slower or started failing after a change. State the symptom with its
      numbers and the window it began in. Read the dashboards, traces, logs and recent changes you
      can reach for that window, and narrow to the highest-confidence hotspot, saying what rules
      the others out. Keep facts (with their source and a screenshot or link) apart from
      hypotheses, labelled as such. Return a short write-up: symptom, window, evidence, likeliest
      cause, how to confirm it, and what to try first. Never change an alert, a dashboard, a
      setting or production.
    tools: []

  - slug: reproduce-a-bug
    title: Reproduce a bug
    summary: Turn a bug report into exact steps, expected and actual behaviour, and the evidence.
    instructions: >-
      Use when the person gives a bug report. Reproduce it in a test or staging environment with a
      test account, never with production customer data. Write the exact steps, what was expected,
      what happened, the environment (build, browser, account), and attach the evidence:
      screenshots, console or network notes, and the smallest input that triggers it. If it does
      not reproduce, say exactly what you tried and what differed from the report. Return a
      reproduction pack a developer can follow without the report. Never change code, data or
      settings beyond the test environment.
    tools: []

  - slug: account-health-watchlist
    title: Rank accounts at risk
    summary: Combine usage, escalations, renewal timing and activity into a ranked watch list.
    instructions: >-
      Use for a portfolio review. For each account, gather what the connected sources say about
      usage, open escalations, renewal date and recent stakeholder activity; say which signals were
      reachable. Rank the accounts by risk and by expansion opportunity, separately, with the
      evidence and the reason for each place on the list. Suggest one next step per account.
      Return the two ranked lists with evidence. Never contact a customer, edit the CRM, or change
      a renewal.
    tools: []

  - slug: summarise-a-document
    title: Summarise a document
    summary: Five bullets, then every date, decision and open question, each with where it is in the document.
    instructions: >-
      Use when the person hands you a document or names one you can reach. Read all of it. Return
      five bullets that say what it is and what it concludes, then three sections: every date,
      every decision, and every open question, each with the page or section it comes from. Quote
      rather than paraphrase where a number or a commitment is concerned. Say what the document
      does not answer. Never change the source document.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content
      - notion/notion-search
      - notion/notion-fetch

  - slug: pull-the-weekly-report
    title: Pull the weekly report
    summary: Gather this week's numbers from the usual sources into the agreed format, with changes marked.
    instructions: >-
      Use for a recurring report. The first time, ask for the format and the sources, and keep
      to them after. Pull each number from its source for the period, note the period and the
      time of each read, and compare with the previous period, marking what moved by more than
      the tolerance the person set. Where a source is unreachable, leave the line and say so
      rather than carrying last week's number forward. Return the report in the agreed format with
      a short "changes" section and a "decisions needed" section at the end. Never publish or send
      the report, and never change the source data.
    tools: []
