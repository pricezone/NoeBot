<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noë Bot</title>
    <!-- Noë Bot's terminal face from the brand guide, inline so no public directory is needed. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%22-1%20-2%2016%2016%22%20shape-rendering=%22crispEdges%22%3E%3Cpath%20fill=%22#ff2056%22%20d=%22M3%200h2v1h-2zM9%200h2v1h-2zM2%201h10v1h-10zM1%202h12v2h-12zM1%204h4v1h-4zM6%204h2v4h-2zM9%204h4v1h-4zM0%205h4v2h-4zM10%205h4v2h-4zM1%207h4v1h-4zM9%207h4v1h-4zM1%208h12v2h-12zM2%2010h10v1h-10zM3%2011h2v1h-2zM9%2011h2v1h-2z%22/%3E%3C/svg%3E" />
    <!-- Sets the theme before the first paint. Must stay inline and classic: `defer` or `type="module"` runs too late. -->
    <script>
      // localStorage throws in some privacy modes; a theme is not worth taking the app down for.
      // Mirrors `parseStoredTheme` + `resolveDark` in src/lib/theme.ts: a stored "dark" or "light"
      // is itself, anything else follows the operating system.
      try {
        const stored = window.localStorage.getItem("openbot-theme");
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
