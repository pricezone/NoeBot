<!--
  The Noë Bot computer's wallpaper: an aurora sky over layered misty hills, with stars and a few
  pointer arrows rising like rockets. Drawn rather than photographed so it is ours, small, and the
  same on every build. Rendered to wallpaper.png, which is what the image ships (the desktop has no
  SVG loader), by render.mjs beside this file: the sky and the scene are rendered apart so the sky
  can be smoothed and dithered without softening the stars, the arrows or the hill edges.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Noë Bot desktop wallpaper</title>
  <defs>
    <linearGradient id="sky-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b8790"/>
      <stop offset="0.35" stop-color="#8fa9a4"/>
      <stop offset="0.6" stop-color="#d6d3c6"/>
      <stop offset="0.72" stop-color="#ebe4da"/>
      <stop offset="1" stop-color="#ece6dd"/>
    </linearGradient>
    <radialGradient id="teal" cx="835" cy="61" r="590" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(835 61) scale(1 1.15) translate(-835 -61)">
      <stop offset="0" stop-color="#55aeac" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#63a9a6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fb0aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mauve" cx="0" cy="0" r="547" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a4a63" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7c6474" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c6474" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peach" cx="0" cy="464" r="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcb59a" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#d9bba2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d9bba2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavender" cx="1440" cy="0" r="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a691b2" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#9c9ab0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#9c9ab0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cream" cx="1440" cy="493" r="504" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eed9c6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#eed9c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6ec" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff6ec" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="far" x1="0" y1="565" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dcd8d6"/><stop offset="1" stop-color="#cfcbca"/></linearGradient>
    <linearGradient id="haze" x1="0" y1="637" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#bfbac0"/><stop offset="1" stop-color="#aea9b1"/></linearGradient>
    <linearGradient id="leftslope" x1="0" y1="607" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#66767f"/><stop offset="1" stop-color="#4d616d"/></linearGradient>
    <linearGradient id="rightrange" x1="0" y1="552" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#90969b"/><stop offset="1" stop-color="#747e86"/></linearGradient>
    <linearGradient id="middark" x1="0" y1="714" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4a6170"/><stop offset="1" stop-color="#3b5363"/></linearGradient>
    <linearGradient id="rightdark" x1="0" y1="649" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#24505f"/><stop offset="1" stop-color="#1c4556"/></linearGradient>
    <linearGradient id="front" x1="0" y1="760" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#123f53"/><stop offset="1" stop-color="#0d3546"/></linearGradient>
  </defs>
