name: Publish NoeBot image

# The image HyperNoesis boots on every subscriber's server. Built from the root Dockerfile on each
# push to main and on version tags, and pushed to this fork's own registry namespace so the
# upstream release workflow (which publishes ghcr.io/copilotkit/*) is left exactly as it is.
# The package is private: the VPS servers pull it with a read-only token. Fly machines cannot pull
# a private GHCR package, so the same tags also go to Fly's org registry when FLY_API_TOKEN is set.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Whether the Fly mirror is pushed; the token itself only reaches the login step.
      HAS_FLY_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HAS_FLY_TOKEN == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/noebot
            name=registry.fly.io/hypernoesis-noebot-image,enable=${{ env.HAS_FLY_TOKEN == 'true' }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      # Fly machines are x86_64; one architecture keeps the build inside a hosted runner's hour.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
